<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca Personal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>📚 Mi Biblioteca</h1>
      <div class="counter-container">
        <div class="counter-card" id="rewardCounter">Cargando...</div>
        <button id="btnRedeem" class="btn-redeem" onclick="redeemCredit()" style="display: none;">🎁 Gastar 1 crédito</button>
      </div>
    </header>

    <div class="controls">
      <div class="tabs">
        <button class="active" onclick="filterStatus('todos', this)">Todos</button>
        <button onclick="filterStatus('leido', this)">Leídos</button>
        <button onclick="filterStatus('en_progreso', this)">En progreso</button>
        <button onclick="filterStatus('sin_leer', this)">Sin leer</button>
      </div>

      <div class="filter-tag-box">
        <select id="tagFilter" class="select-tag-filter" onchange="filterTag(this.value)">
          <option value="todas">🏷️ Todas las etiquetas</option>
        </select>
      </div>

      <button id="btnToggleHidden" class="btn-toggle-hidden" onclick="toggleShowHidden()">👁️ Mostrar contenido oculto</button>

      <div class="search-box">
        <input type="text" id="localSearch" class="search-bar" placeholder="Buscar en mi biblioteca..." oninput="renderGrid()">
        <button onclick="addManualBook()" class="btn-add">➕ Añadir Libro</button>
      </div>
    </div>

    <div id="bookGrid" class="grid"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
